<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Petualangan IPAS Kelas 2 Semester 2
  </title>
  <link href="style.css" rel="stylesheet"/>
  <link href="map.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="ipas-app">
   <main class="embedded-content">
    <div class="cloud one">
    </div>
    <div class="cloud two">
    </div>
    <div class="sun">
     ☀️
    </div>
    <div class="map-title">
     <h1>
      🌈 PETUALANGAN IPAS KELAS 2
     </h1>
     <p>
      Semester 2 — Ayo belajar sambil bermain!
     </p>
    </div>
    <div class="map-scene">
     <div class="path">
     </div>
     <div aria-label="Karakter pemandu" class="map-hero">
      👦🏻
     </div>
     <div aria-label="Maskot pemandu" class="guide">
      🦋
     </div>
     <a class="map-level level-one" data-level="1" href="bab1.html">
      <span class="level-icon">
       🧺
      </span>
      <strong>
       LEVEL 1
       <br/>
       Kebutuhan Hidup
      </strong>
      <small>
       ☆☆☆☆☆
      </small>
     </a>
     <a class="map-level level-two" data-level="2" href="bab2.html">
      <span class="level-icon">
       🌍
      </span>
      <strong>
       LEVEL 2
       <br/>
       Lingkungan dan Waktu
      </strong>
      <small>
       ☆☆☆☆☆
      </small>
     </a>
     <a class="map-level level-three" data-level="3" href="bab3.html">
      <span class="level-icon">
       🐝
      </span>
      <strong>
       LEVEL 3
       <br/>
       Hewan & Peranannya
      </strong>
      <small>
       ☆☆☆☆☆
      </small>
     </a>
     <a class="map-level level-four" data-level="4" href="bab4.html">
      <span class="level-icon">
       🌱
      </span>
      <strong>
       LEVEL 4
       <br/>
       Menjaga Alam
      </strong>
      <small>
       ☆☆☆☆☆
      </small>
     </a>
    </div>
   </main>
   <div class="portrait-message">
    📱↔️
    <br/>
    Putar perangkatmu ke landscape
    <br/>
    untuk pengalaman terbaik.
   </div>
  </div>
  <script src="sound-manager.js"></script>
  <script src="index-script.js"></script>
 </body>
</html>
