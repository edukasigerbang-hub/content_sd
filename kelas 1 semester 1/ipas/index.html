<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Petualangan IPAS</title><link rel="stylesheet" href="embedded-module.css"><link rel="stylesheet" href="embedded-map.css"></head><body><div id="ipas-app"><main class="embedded-content"><div class="cloud one"></div><div class="cloud two"></div><div class="sun">☀️</div><div class="map-title"><h1>🌟 PETA PETUALANGAN IPAS</h1><p>Ayo belajar sambil bermain!</p></div><div class="map-scene"><div class="path"></div><div class="map-hero">👦🏻</div><div class="guide">🦋</div><a class="map-level level-one" href="bab1.html"><span class="level-icon">🧍</span><strong>LEVEL 1<br>Tubuhku Hebat</strong><small>☆☆☆☆☆</small></a><a class="map-level level-two" href="bab2.html"><span class="level-icon">🏠</span><strong>LEVEL 2<br>Lingkunganku</strong><small>☆☆☆☆☆</small></a><a class="map-level level-three" href="bab3.html"><span class="level-icon">🌱</span><strong>LEVEL 3<br>Tumbuhan</strong><small>☆☆☆☆☆</small></a><a class="map-level level-four" href="bab4.html"><span class="level-icon">🐱</span><strong>LEVEL 4<br>Hewan</strong><small>☆☆☆☆☆</small></a></div></main><div class="portrait-message">📱↔️<br>Putar perangkatmu ke landscape<br>untuk pengalaman terbaik.</div></div><script>(function(){const progress=JSON.parse(localStorage.getItem('IPAS')||'{}');document.querySelectorAll('.map-level').forEach((level,index)=>{const stars=Number(progress['bab'+(index+1)]?.stars)||0;const label=level.querySelector('small');if(label)label.textContent='★'.repeat(stars)+'☆'.repeat(5-stars)});const check=()=>{console.assert(document.documentElement.scrollWidth<=document.documentElement.clientWidth,'ERROR: Horizontal overflow detected');console.assert(document.documentElement.scrollHeight<=document.documentElement.clientHeight,'ERROR: Vertical overflow detected')};check();window.addEventListener('resize',check)})();</script></body></html>
