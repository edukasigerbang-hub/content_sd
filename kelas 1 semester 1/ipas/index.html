evel.addEventListener('click',event=>{event.preventDefault()})}});const check=()=>{console.assert(document.documentElement.scrollWidth<=document.documentElement.clientWidth,'ERROR: Horizontal overflow detected');console.assert(document.documentElement.scrollHeight<=document.documentElement.clientHeight,'ERROR: Vertical overflow detected')};check();window.addEventListener('resize',check)})();</script></body></html>
