<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan IPAS Kelas 1</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--ink:#17365d;--blue:#287fd0;--sky:#bdeaff;--cream:#fff4c9;--green:#67bf78;--pink:#ff9db4;--gold:#f4b52b}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:#bdeaff}#mapApp{width:100vw;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:12% minmax(0,76%) 12%;position:relative}.map-header{background:rgba(255,255,255,.94);border-bottom:2px solid #a8d7ec;display:flex;align-items:center;z-index:2}.map-header-inner{width:min(1240px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.brand .logo{width:54px;height:54px;font-size:31px}.brand h1{margin:0;color:#1355a4;font-size:clamp(22px,3vw,34px)}.brand span{display:block;color:#55708f;font-weight:800}.map-tools{display:flex;align-items:center;gap:9px}.tool-button,.star-counter{min-height:44px;border:0;border-radius:15px;padding:9px 14px;background:#e9f6ff;color:#1355a4;font-weight:900;cursor:pointer}.star-counter{background:#fff0b5;color:#936600}.map-main{min-height:0;position:relative;overflow:hidden;background:linear-gradient(180deg,#bdeaff 0%,#dff7ff 62%,#a9df9c 62%,#83cb7e 100%)}.cloud{position:absolute;border-radius:50px;background:rgba(255,255,255,.75);width:120px;height:30px}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:48px;height:48px;left:20px;top:-20px}.cloud:after{width:60px;height:60px;left:58px;top:-28px}.cloud.one{left:8%;top:12%}.cloud.two{right:9%;top:23%;transform:scale(.75)}.sun{position:absolute;right:18%;top:8%;font-size:clamp(35px,7vh,70px);animation:float 3s ease-in-out infinite}.map-title{position:absolute;top:7%;left:50%;transform:translateX(-50%);text-align:center;z-index:1}.map-title h2{margin:0;color:#1355a4;font-size:clamp(25px,4vw,48px);text-shadow:0 3px #fff}.map-title p{margin:5px 0 0;font-size:clamp(14px,1.7vw,21px);font-weight:800}.map-scene{position:absolute;inset:0;margin:auto;width:min(1120px,92%);height:100%}.hill{position:absolute;bottom:-16%;width:70%;height:55%;border-radius:50% 50% 0 0;background:#91d486;opacity:.72}.hill.left{left:-14%}.hill.right{right:-14%;background:#75c877}.path{position:absolute;left:12%;right:12%;top:60%;height:16px;border-radius:20px;background:#eab965;transform:rotate(-4deg);box-shadow:0 4px 0 #cf9d4e}.path:before,.path:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff6c8;top:-1px;box-shadow:160px 4px 0 #fff6c8,320px -2px 0 #fff6c8,480px 2px 0 #fff6c8}.map-hero{position:absolute;left:7%;bottom:8%;font-size:clamp(58px,13vh,132px);filter:drop-shadow(0 8px 2px #377e9b55);animation:bob 3.2s ease-in-out infinite}.map-level{position:absolute;width:clamp(150px,17vw,210px);min-height:clamp(112px,20vh,160px);padding:12px;border:4px solid #fff;border-radius:24px;background:#fffdf0;box-shadow:0 10px 20px #477d6055;text-align:center;z-index:1;transition:transform .2s}.map-level:hover{transform:translateY(-6px) rotate(-1deg)}.map-level .level-icon{display:block;font-size:clamp(35px,7vh,70px);line-height:1}.map-level strong{display:block;margin-top:5px;color:#1355a4;font-size:clamp(16px,1.7vw,22px)}.map-level small{display:block;margin-top:5px;color:#68809a;font-weight:800}.map-level .level-stars{color:#e8a900;font-size:15px}.level-one{left:16%;top:28%;transform:rotate(-2deg)}.level-two{left:42%;top:52%;transform:rotate(2deg)}.level-three{right:18%;top:30%;transform:rotate(-2deg)}.level-four{right:5%;bottom:7%;transform:rotate(3deg)}.map-level.locked{filter:grayscale(.8);opacity:.82}.map-level.locked:after{content:"🔒";position:absolute;right:9px;top:7px;font-size:20px}.guide{position:absolute;right:5%;top:9%;font-size:clamp(32px,7vh,68px);animation:bob 3s ease-in-out infinite .4s}.map-nav{display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,70px);background:rgba(255,255,255,.96);border-top:2px solid #a8d7ec}.map-nav a,.map-nav button{border:0;background:transparent;color:#1355a4;font-weight:900;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:7px}.map-nav span{font-size:clamp(21px,3vw,32px)}.sound-on{background:#dff7e6!important;color:#18703e!important}@keyframes float{50%{transform:translateY(-8px)}}@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}@media(max-width:700px) and (orientation:landscape){.map-title{top:3%}.map-title h2{font-size:28px}.map-title p{font-size:14px}.map-level{width:130px;min-height:80px;padding:7px;border-width:3px;border-radius:16px}.map-level .level-icon{font-size:34px}.map-level strong{font-size:14px}.map-level small{font-size:11px}.level-one{left:8%;top:25%}.level-two{left:34%;top:51%}.level-three{right:20%;top:22%}.level-four{right:3%;bottom:4%}.map-hero{left:2%;bottom:5%;font-size:66px}.guide{right:2%;top:2%;font-size:35px}.path{left:12%;right:10%;top:65%}.brand .logo{width:42px;height:42px;font-size:24px}.brand h1{font-size:21px}.brand span{font-size:12px}.tool-button,.star-counter{padding:7px 9px;font-size:12px}}
@media(max-width:700px) and (orientation:portrait){#mapApp>*{visibility:hidden}#mapApp:after{content:'📱 Putar perangkatmu ke posisi mendatar untuk menjelajah.';visibility:visible;position:fixed;inset:0;display:grid;place-items:center;padding:25px;background:#e8f8ff;color:#1355a4;text-align:center;font-size:20px;font-weight:900}}
</style>
<link rel="stylesheet" href="adventure-home.css">
</head>
<body>
<div id="mapApp"><header class="map-header"><div class="map-header-inner"><a class="brand" href="index.html"><div class="logo">🏠</div><div><h1>IPAS Kelas 1</h1><span>Petualangan Semester 1</span></div></a><div class="map-tools"><button class="tool-button" id="soundButton" aria-label="Aktifkan suara">🔊</button><div class="star-counter">⭐ <span id="totalStars">0</span></div></div></div></header><main class="map-main"><div class="cloud one"></div><div class="cloud two"></div><div class="sun">☀️</div><div class="map-title"><h2>🌟 PETA PETUALANGAN IPAS</h2><p>Pilih dunia yang ingin kamu jelajahi!</p></div><div class="hill left"></div><div class="hill right"></div><div class="map-scene"><div class="path"></div><div class="map-hero" aria-label="Karakter pemandu">👦🏻</div><div class="guide" aria-label="Maskot pemandu">🦋</div><a class="map-level level-one" href="bab1.html"><span class="level-icon">🧍</span><strong>LEVEL 1<br>Tubuhku Hebat</strong><small id="stars1">☆☆☆☆☆</small></a><a class="map-level level-two" href="bab2.html"><span class="level-icon">🏠</span><strong>LEVEL 2<br>Lingkunganku</strong><small id="stars2">☆☆☆☆☆</small></a><a class="map-level level-three" href="bab3.html"><span class="level-icon">🌱</span><strong>LEVEL 3<br>Tumbuhan</strong><small id="stars3">☆☆☆☆☆</small></a><a class="map-level level-four" href="bab4.html"><span class="level-icon">🐱</span><strong>LEVEL 4<br>Hewan</strong><small id="stars4">☆☆☆☆☆</small></a></div></main><nav class="map-nav"><a href="bab1.html"><span>🎮</span>Bermain</a><a href="bab1.html"><span>📝</span>Latihan</a><button id="mapStars"><span>⭐</span>Bintangku</button></nav></div>
<script>const progress=JSON.parse(localStorage.getItem('IPAS')||'{}');let total=0;[1,2,3,4].forEach(n=>{const stars=Number(progress['bab'+n]?.stars)||0;total+=stars;const node=document.getElementById('stars'+n);if(node)node.textContent='★'.repeat(stars)+'☆'.repeat(5-stars)});document.getElementById('totalStars').textContent=total;let sound=false;const speak=text=>{if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}};document.getElementById('soundButton').onclick=()=>{sound=!sound;document.getElementById('soundButton').classList.toggle('sound-on',sound);speak('Selamat datang di peta petualangan IPAS')};document.getElementById('mapStars').onclick=()=>speak('Kamu sudah mengumpulkan '+total+' bintang');</script>
</body>
</html>
