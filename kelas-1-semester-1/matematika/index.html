<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematika Kelas 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="grade1-body">
    <div class="grade1-app">
      <header class="grade1-header">
        <div class="grade1-header-item grade1-stars">⭐ <span id="starCount">0</span></div>
        <div class="grade1-header-item grade1-title">MATEMATIKA</div>
        <button class="grade1-icon-button" id="repeatIntroBtn" aria-label="Dengarkan instruksi" type="button">🔊</button>
      </header>

      <main class="grade1-screen active" id="homeScreen">
        <section class="grade1-character-panel">
          <div class="grade1-character" aria-label="Kiko si Kelinci Belajar">🐰</div>
          <div class="grade1-bubble">
            <p id="homeBubble">Ayo bermain matematika!</p>
          </div>
        </section>

        <button class="grade1-primary-button" id="startBtn" type="button">🔢 MULAI BERHITUNG</button>

        <section class="grade1-worlds" aria-label="Topik matematika kelas 1">
          <button class="grade1-world-card grade1-world-card--a" type="button" data-world="bilangan">
            <span class="grade1-world-icon">🔢</span>
            <span class="grade1-world-name">Bilangan</span>
          </button>
          <button class="grade1-world-card grade1-world-card--b" type="button" data-world="membilang">
            <span class="grade1-world-icon">🍎</span>
            <span class="grade1-world-name">Membilang</span>
          </button>
          <button class="grade1-world-card grade1-world-card--c" type="button" data-world="membandingkan">
            <span class="grade1-world-icon">⚖️</span>
            <span class="grade1-world-name">Membandingkan</span>
          </button>
          <button class="grade1-world-card grade1-world-card--d" type="button" data-world="operasi">
            <span class="grade1-world-icon">➕</span>
            <span class="grade1-world-name">Operasi</span>
          </button>
          <button class="grade1-world-card grade1-world-card--e" type="button" data-world="bentuk">
            <span class="grade1-world-icon">🔺</span>
            <span class="grade1-world-name">Bentuk</span>
          </button>
          <button class="grade1-world-card grade1-world-card--f" type="button" data-world="ukuran">
            <span class="grade1-world-icon">📏</span>
            <span class="grade1-world-name">Ukuran</span>
          </button>
          <button class="grade1-world-card grade1-world-card--a" type="button" data-world="pola" style="grid-column: 1 / -1;">
            <span class="grade1-world-icon">🔁</span>
            <span class="grade1-world-name">Pola</span>
          </button>
        </section>
      </main>

      <main class="grade1-screen" id="lessonScreen" aria-live="polite">
        <section class="grade1-lesson-top">
          <div class="grade1-lesson-tag" id="lessonTag">Bilangan</div>
          <button class="grade1-secondary-button" id="homeBtn" type="button">🏠</button>
        </section>

        <section class="grade1-activity-card">
          <div class="grade1-character-panel small">
            <div class="grade1-character tiny" aria-label="Kiko">🐰</div>
            <div class="grade1-bubble small-bubble">
              <p id="dialogue">Ayo belajar!</p>
            </div>
          </div>

          <div class="grade1-stage" id="activityStage"></div>
          <div class="grade1-options" id="optionsList"></div>

          <div class="grade1-action-row">
            <button class="grade1-secondary-button" id="repeatBtn" type="button">🔊 Dengarkan lagi</button>
            <button class="grade1-primary-button compact" id="nextBtn" type="button">Lanjut</button>
          </div>
        </section>

        <section class="grade1-progress" aria-label="Progress bintang">
          <div class="grade1-progress-label">Bintang</div>
          <div class="grade1-progress-stars" id="progressStars"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
